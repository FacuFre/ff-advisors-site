server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    location = /robots.txt { try_files /robots.txt =404; }
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /favicon.png { try_files /favicon.png =404; }

    location = / {
        try_files /index.html =404;
    }
    location = /fal {
        try_files /index.html =404;
    }
    location = /privacidad {
        try_files /index.html =404;
    }
    location = /clientes {
        try_files /index.html =404;
    }
    location = /agro {
        try_files /agro.html /index.html =404;
    }
    location = /aprende {
        try_files /aprende.html /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }
}
